name: C/C++ CI

on:
  push:
    branches:
      - master
      - development
      - refactor-with-db
    paths:
      - "**.cpp"
      - "**.h"
      - "**.hpp"
      - "**.bat"
      - "**.txt"
      - ".github/workflows/**"
      - "!.vscode**"
      - "!**.md"
      - "!LICENSE"
      - "!CNAME"
  pull_request:
    branches:
      - master

jobs:
  Ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Updating Git
        run: |
          sudo apt update
          sudo apt -y install git
      - uses: actions/checkout@v4
        with:
          submodules: "true"
          token: ${{ secrets.SUBMODULE_KEY }}
      - name: Getting prerequisites
        run: |
          sudo apt upgrade -y
          sudo apt -y install g++ cmake libcurl4-openssl-dev libncurses5-dev libncursesw5-dev
      - name: Building application
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release

  Debian:
    runs-on: ubuntu-latest
    container: debian
    steps:
      - name: Updating Git
        run: |
          apt update
          apt install -y git
      - uses: actions/checkout@v4
        with:
          submodules: "true"
          token: ${{ secrets.SUBMODULE_KEY }}
      - name: Getting prerequisites
        run: |
          apt upgrade -y
          apt -y install g++ cmake libcurl4-openssl-dev libncurses5-dev libncursesw5-dev
      - name: Building application
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release

  Arch-Linux:
    runs-on: ubuntu-latest
    container: archlinux
    steps:
      - name: Updating Git
        run: |
          pacman -Syy --noconfirm
          pacman -S git --noconfirm
      - uses: actions/checkout@v4
        with:
          submodules: "true"
          token: ${{ secrets.SUBMODULE_KEY }}
      - name: Getting prerequisites
        run: |
          pacman -Syu --noconfirm
          pacman -S gcc cmake make curl ncurses --noconfirm
      - name: Building application
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release

  Fedora-Linux:
    runs-on: ubuntu-latest
    container: fedora
    steps:
      - name: Updating Git
        run: |
          dnf -y upgrade
          dnf -y install git
      - uses: actions/checkout@v4
        with:
          submodules: "true"
          token: ${{ secrets.SUBMODULE_KEY }}
      - name: Getting prerequisites
        run: |
          dnf -y upgrade
          dnf -y install gcc-c++ cmake ncurses-devel libcurl-devel
      - name: Building application
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release

  Kali-Linux:
    runs-on: ubuntu-latest
    container: kalilinux/kali-rolling
    steps:
      - name: Updating Git
        run: |
          apt -y update
          apt -y install git
      - uses: actions/checkout@v4
        with:
          submodules: "true"
          token: ${{ secrets.SUBMODULE_KEY }}
      - name: Getting prerequisites
        run: |
          apt -y upgrade
          apt -y install g++ cmake libcurl4-openssl-dev libncurses5-dev libncursesw5-dev
      - name: Building application
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release

  Alpine:
    runs-on: ubuntu-latest
    container: alpine
    steps:
      - name: Updating Git
        run: |
          apk update
          apk add git
      - uses: actions/checkout@v4
        with:
          submodules: "true"
          token: ${{ secrets.SUBMODULE_KEY }}
      - name: Getting prerequisites
        run: |
          apk upgrade
          apk add g++ cmake make curl-dev ncurses-dev
      - name: Building application
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release

  Windows:
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: [Debug, Release, MinSizeRel]
        architecture: [Win32, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
          token: ${{ secrets.SUBMODULE_KEY }}
      - name: Compiling the main project for MinGW G++ compiler
        run: |
          mkdir build && cd build
          cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          cmake --build . --config ${{ matrix.build_type }}
          cd .. && rm -r -force build
      - name: Compiling the main project for MSVC compiler
        run: |
          mkdir build && cd build
          cmake .. -G "Visual Studio 17 2022" -A ${{ matrix.architecture }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          cmake --build . --config ${{ matrix.build_type }}
          cd .. && rm -r -force build

  MacOS:
    runs-on: macos-latest
    strategy:
      matrix:
        xcode: [16.0, 16.4, 26.0.1, 26.3]
        build_type: [Debug, Release, MinSizeRel]
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
          token: ${{ secrets.SUBMODULE_KEY }}
      - name: Installing Xcode
        run: |
          sudo xcode-select -s $DEVELOPER_DIR
          sudo xcode-select -r
      - name: Building and compiling using CMake as Xcode Project
        run: |
          mkdir build && cd build
          cmake .. -G "Xcode" -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          cmake --build . --config ${{ matrix.build_type }}

  Alpine-Static-x86_64:
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - name: Installing Git
        run: |
          apk update
          apk add git
      - uses: actions/checkout@v4
        with:
          submodules: "true"
          token: ${{ secrets.SUBMODULE_KEY }}
      - name: Getting prerequisites
        run: |
          apk upgrade
          apk add g++ cmake make curl-dev curl-static ncurses-dev ncurses-static nghttp2-static brotli-static openssl-libs-static zlib-static
      - name: Remove shared libraries to force static linking
        run: |
          rm -f /usr/lib/libcurl.so* /usr/lib/libncurses*.so* /usr/lib/libform*.so* /usr/lib/libpanel*.so* /usr/lib/libmenu*.so*
      - name: Building static application
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXE_LINKER_FLAGS="-static" -DCMAKE_FIND_LIBRARY_SUFFIXES=".a"
          cmake --build . --config Release
      - name: Verify static linking
        run: |
          ldd build/MarkIt && echo "ERROR: Binary is dynamically linked!" && exit 1 || echo "Binary is statically linked (ldd reports 'not a dynamic executable')"
      - name: Prepare artifact
        run: |
          cp build/MarkIt MarkIt-linux-x86_64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkIt-linux-x86_64
          path: MarkIt-linux-x86_64

  Alpine-Static-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
          token: ${{ secrets.SUBMODULE_KEY }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build static application in ARM64 Alpine
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            arm64v8/alpine:latest \
            sh -c "
              apk update && apk upgrade &&
              apk add g++ cmake make curl-dev curl-static ncurses-dev ncurses-static nghttp2-static brotli-static openssl-libs-static zlib-static &&
              rm -f /usr/lib/libcurl.so* /usr/lib/libncurses*.so* /usr/lib/libform*.so* /usr/lib/libpanel*.so* /usr/lib/libmenu*.so* &&
              mkdir -p build && cd build &&
              cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXE_LINKER_FLAGS='-static' -DCMAKE_FIND_LIBRARY_SUFFIXES='.a' &&
              cmake --build . --config Release
            "
      - name: Verify static linking
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            arm64v8/alpine:latest \
            sh -c "ldd build/MarkIt && echo 'ERROR: Binary is dynamically linked!' && exit 1 || echo 'Binary is statically linked (ldd reports not a dynamic executable)'"
      - name: Prepare artifact
        run: |
          cp build/MarkIt MarkIt-linux-aarch64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkIt-linux-aarch64
          path: MarkIt-linux-aarch64
