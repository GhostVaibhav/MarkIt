name: Static Linux Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - development
      - refactor-with-db
    paths:
      - "**.cpp"
      - "**.h"
      - "**.hpp"
      - ".github/workflows/static-linux-build.yml"

jobs:
  build:
    name: Static Build - ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7
          - arch: i686
            platform: linux/386
          - arch: riscv64
            platform: linux/riscv64
          - arch: ppc64le
            platform: linux/ppc64le
          - arch: s390x
            platform: linux/s390x

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "true"
          token: ${{ secrets.SUBMODULE_KEY }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build static MarkIt for ${{ matrix.arch }} for the latest version and the last version
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            alpine:latest \
            sh -c '
              apk update && apk upgrade &&
              apk add git g++ cmake make pkgconf \
                curl-dev curl-static \
                ncurses-dev ncurses-static \
                nghttp2-static nghttp3-static ngtcp2-static \
                brotli-static openssl-libs-static zlib-static \
                libpsl-static libidn2-static libunistring-static zstd-static &&
              rm -f /usr/lib/libcurl.so* /usr/lib/libncurses*.so* /usr/lib/libform*.so* /usr/lib/libpanel*.so* /usr/lib/libmenu*.so* &&
              CURL_STATIC_LIBS=$(pkg-config --static --libs libcurl) &&
              mkdir -p build_new && cd build_new &&
              cmake .. -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_EXE_LINKER_FLAGS="-static -no-pie -Wl,--start-group" \
                -DCMAKE_FIND_LIBRARY_SUFFIXES=".a" \
                -DCMAKE_CXX_STANDARD_LIBRARIES="${CURL_STATIC_LIBS} -Wl,--end-group" &&
              cmake --build . --config Release -- -j16 &&

              git config --global --add safe.directory /workspace &&
              latest_tag=$(git describe --tags --abbrev=0) &&
              git reset --hard $latest_tag &&

              cd .. &&
              mkdir -p build_old && cd build_old &&
              cmake .. -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_EXE_LINKER_FLAGS="-static -no-pie -Wl,--start-group" \
                -DCMAKE_FIND_LIBRARY_SUFFIXES=".a" \
                -DCMAKE_CXX_STANDARD_LIBRARIES="${CURL_STATIC_LIBS} -Wl,--end-group" &&
              cmake --build . --config Release -- -j16
            '

      - name: Verify static linking
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            alpine:latest \
            sh -c "ldd build_new/MarkIt && echo 'ERROR: Binary is dynamically linked!' && exit 1 || echo 'Binary is statically linked (ldd reports not a dynamic executable)'"

      - name: Prepare artifact
        run: |
          ls -l build_new
          ls -l build_old

          mkdir -p release
          cp build_new/MarkIt release/MarkIt-linux-${{ matrix.arch }}
          cp build_new/markit_updater release/markit_updater

          mkdir -p release_old
          cp build_old/MarkIt release_old/MarkIt-linux-${{ matrix.arch }}
          cp build_old/markit_updater release_old/markit_updater

          cp build_new/tools/markit_patcher markit_patcher

          mkdir -p patch_output
          mkdir -p staging
          ./markit_patcher "./build_old" "./build_new" "./patch_output"
          cd patch_output
          tar -czvf ../staging/patches-linux-${{ matrix.arch }}.tar.gz -C . instructions.json patches.bin
          cd ..
          cp ./staging/patches-linux-${{ matrix.arch }}.tar.gz ./patches-linux-${{ matrix.arch }}.tar.gz

          cd release
          tar czf ../MarkIt-linux-${{ matrix.arch }}.tar.gz \
            MarkIt-linux-${{ matrix.arch }} markit_updater

      - name: Upload artifact for release
        uses: actions/upload-artifact@v4
        with:
          name: MarkIt-linux-${{ matrix.arch }}
          path: MarkIt-linux-${{ matrix.arch }}.tar.gz

      - name: Upload artifact for patches
        uses: actions/upload-artifact@v4
        with:
          name: patches-linux-${{ matrix.arch }}
          path: patches-linux-${{ matrix.arch }}.tar.gz
